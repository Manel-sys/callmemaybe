[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling tool for a small parameter LLM using constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "manferre"}
]
dependencies = [
    "numpy",
    "pydantic>=2",
    "llm_sdk",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk"}

[tool.mypy]
plugins = ["pydantic.mypy"]
